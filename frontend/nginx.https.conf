# =====================================================================
# nginx.conf для production HTTPS.
#
# Использование:
#   cp frontend/nginx.https.conf frontend/nginx.conf
#   # затем пересобрать frontend образ:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml \
#     --env-file .env up -d --build --force-recreate frontend
#
# Предусловия:
#   1) Сертификат от certbot лежит в /etc/letsencrypt/live/<domain>/
#   2) Эта папка примонтирована в контейнер через docker-compose.https.yml
#   3) В .env: PUBLIC_BASE_URL=https://<domain> и компания
#   4) TCP 443 открыт в AWS Security Group
# =====================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — основной сервер
server {
    listen 443 ssl http2 default_server;
    server_name realsync.ddns.net localhost _;

    ssl_certificate     /etc/letsencrypt/live/realsync.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realsync.ddns.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_vary on;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket → api-gateway
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }

    location = /nginx-health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
