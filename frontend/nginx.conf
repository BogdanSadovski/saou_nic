# Карта для безопасного WebSocket-апгрейда: ставим
# `Connection: upgrade` только когда запрос реально просит апгрейд.
# Для обычных HTTP-запросов отдаём пустой Connection, иначе keep-alive
# к api-gateway отваливается на каждом 2-м запросе.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    # Слушаем и домен NoIP, и host-bind (для health-checks), и
    # любой другой Host (на случай захода по IP инстанса).
    server_name realsync.ddns.net localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка резюме до 20 МБ — без этого default 1MB режет PDF/DOCX.
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_vary on;

    # ── SPA routing ─────────────────────────────────────────
    # все неизвестные пути отдают index.html, чтобы react-router
    # сам отрисовал нужный экран.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → api-gateway ─────────────────────────────
    # api-gateway сам мультиплексирует на конкретные микросервисы.
    # Аккуратно обрабатываем WebSocket: `Connection: upgrade` ставится
    # ТОЛЬКО если запрос реально просит апгрейд (через map ниже).
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket удержание: интервью-канал может молчать минуты,
        # пока LLM думает над ответом. Стандартные 60 секунд рвали
        # соединение.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }

    # Здоровье nginx-контейнера — отвечает 200 без обращения к
    # api-gateway, чтобы инфра-проверки не валились, если бэк лёг.
    location = /nginx-health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # ── Статика с длинным кешем ─────────────────────────────
    # Vite hash-имена → immutable. Шрифты тоже cache-1y.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
